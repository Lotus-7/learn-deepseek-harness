id: s14
stage: 5
slug: bundles
title: 'bundles：profile 与 bundle——同一批插件组装出不同产品'
idea: 's08 以来装配一直是手写函数：五件套 + 各能力插件一行行 mount。本课把装配变成数据—— base 层（BASE 行表：五件套 +
  world/subagent/skill/workflow 各 seam 的基线装配， 中性默认值）、profile 层（full：全工具 + 危险操作
  ask + 基准压缩阈值；safe：委派/后台/可恢复清理 砍出模型面、写/跑/删留在名册直接 deny（fail-closed）、阈值 380
  更早压）、patch 层（一行整行重述换策略）。 profile 是数据不是代码分叉：两个 profile 共享同一份 BASE 行、同一个
  TOOL_CATALOG、唯一的 assembleBundle——结构断言钉住（未覆盖行是 base 同一对象、装配出的插件列表一致、JSON 往返后
  resolve 不变）。覆盖语义与 dsh 逐字对齐：按 id 定位、整体替换、不深合并（"A patch replaces whole row
  configs — profile overrides must restate every field a row keeps"）——解锁
  write_file 的 patch 必须照抄其余 deny。装配器拆成两半：resolveBundle 纯函数在挂载之前完成全部校验（覆盖的行 id
  存在、plugin 一致、名册点名目录内工具、 权限规则点名名册内工具、压缩参数合法——错引响亮报错并列出可用值，misconfiguration
  fails loud 的前置版；对照真码取舍：dsh 的用户 patch 层对缺失 id 只 warn，
  因为用户文件面对版本漂移），assembleBundle 按行序挂载（教学版行序即挂载序； dsh "Row order carries no load
  semantics"）。演示四幕：装配对比 → 同一请求在 full 下写/跑经 ask 批准通过 → 同一请求在 safe 下写被 deny
  回喂、模型改走只读路径 → 一行 patch 解锁 write_file 结局翻转（跑仍被拒——整行重述没顺带解锁）。dsh 对应： dsh-base 的
  cordis.patch.yml（每个 profile 的第一层）、web-app/headless 两个 mode bundle、app-boot 的
  loadProfile/composeEntries、apps/cli 的 --profile 旗子。'
