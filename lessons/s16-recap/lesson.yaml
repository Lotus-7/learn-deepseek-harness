slug: recap
title: 'recap：全景回顾——扩展点地图与通向你的业务'
idea: '收官课不加新机制，做两件事：① 整合演示——s14 的 full profile 为底座跑一条覆盖面最广的
  剧本，一轮对话串起技能加载（s12）、大文件读入触发压缩（s06）、沙箱命令（s10）、后台 job 两段
  收取（s12）、子代理复核折叠回父（s11）、落盘 + 重启 resume 续聊（s13），mock 确定性驱动，
  每能力面至少一条事件/状态断言；重启后第一次模型请求包含重启前事实是记忆延续的硬证据， 收束面断言全链路 append-only（磁盘逐事件一致 +
  仅凭文件重放投影一致 + 一事件一行）。 ② 文稿为重心：对照总表把 architecture.md 的 Where new behavior goes
  18 行逐行对上课程 （哪课写过、教学版对应物、未覆盖面如实标注）；「通向你的业务」导读（加工具/换模型/换执行环境/ 改权限/新 seam
  三角色清单，每条课号 + 真仓路径）；16 课术语精选总表。代码上补齐底座缺口： persistence 行收进 BASE（s14
  时在运行时装配位），行序在 tools 前——种子历史经 persistence 服务流向 tools 行（Ctx.has 显式分支）；恢复 s12 真跑的
  summary-report 工作流（s14 曾收占位）。'
