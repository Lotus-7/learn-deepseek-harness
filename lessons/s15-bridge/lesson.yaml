title: 'bridge：桥接课——用真实 @deepseek-ai/dsh-* 包组装自己的 mini harness'
idea: '前 14 课你写了一个教学 harness；这一课一个都不复制——直接依赖真实 npm 包，把同一套概念在真包上重装一遍。'
lines: 224
tools: 2
dsh:
  - label: npm @deepseek-ai/dsh-* family（本课依赖的发布物本身；cordis 运行时同scope 发布
      @deepseek-ai/cordis@4.0.1。dsh family 公开发布的机制在 vendor/README.md："every
      harness package declares cordis as a peer dependency, so publishing the
      harness publishes this framework layer too"——本课 pnpm install 拉下来的就是这套两层结构）
    url: https://github.com/deepseek-ai/deepseek-harness/tree/master/vendor/README.md
  - label: packages/llm/llm/src/index.ts（llm seam 的 Service Definition：LlmRuntime
      adapter 注册表 + 流式调用 API；LlmAdapter 抽象类里 stream() 是唯一必须实现的方法—— 本课
      ScriptedAdapter 的接口面，providerInfo/resolveModel 都有默认实现）
    url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/llm/llm/src/index.ts
  - label: packages/core/agent-loop/src/index.ts（AgentLoop 的 static inject =
      ['agents','sessions','llm','tools','systemPrompt'] 是本课最小组装清单的权威出处；
      create(id, options) 编程面创建 agent；驱动词汇 turn/step 与 followup/whenIdle 生命周期）
    url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/core/agent-loop/src/index.ts
  - label: packages/core/agent-loop/tests/mock-adapter.ts 与 agent.spec.ts（上游自己的
      keyless 组装路径：MockAdapter extends LlmAdapter 回放剧本 chunk，测试用 new
      Context()+六个 ctx.plugin()+registerAdapter 组装出完整循环——本课组装代码的出处）
    url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/core/agent-loop/tests/mock-adapter.ts
  - label: packages/examples/agent-spine-demo/src/index.ts（产品级「全家桶」装配：apply() 把
      Timer/llm/session/system-prompt/tools/skill/agent/jobs/invariants/bash/workspace-context
      逐个 ctx.plugin 成一棵 spine 树——本课是它的六包裁剪版，对照看「最小 vs 产品」差在哪）
    url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/examples/agent-spine-demo/src/index.ts
  - label: examples/headless-agent/cordis.yml（dsh 真实例子的声明式组装：不走编程面 ctx.plugin，而是
