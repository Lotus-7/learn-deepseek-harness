id: s15
stage: 5
slug: bridge
title: 'bridge：桥接课——用真实 @deepseek-ai/dsh-* 包组装自己的 mini harness'
idea: '前 14 课的教学 harness 是自己写的：自己 defineTool、自己 append 事件日志、自己 mount 插件。
  本课不复制前进——站在课程自建代码之外，另起一个直接依赖真实 npm 包 (@deepseek-ai/cordis@4.0.1 + 六个
  @deepseek-ai/dsh-*@0.1.0-rc.8，逐包 npm view 核实)的最小项目，把同一套概念在真包上重装一遍：llm seam
  上挂一个自写剧本式 adapter（继承 LlmAdapter、只实现 stream() 一个方法、按序吐 StreamChunk——与上游
  agent-loop 自己的 keyless 测试同一条无 key 组装路径），tools seam 上用真 defineTool 注册
  add/echo，六个包挂成一棵 cordis 插件树（LlmRuntime/SessionStore/
  SystemPrompt/ToolRuntime/AgentRegistry/AgentLoop——正是 AgentLoop.inject 点名的五个
  服务再加驱动器自己），然后 followup 一句话跑通 s01 的同款剧本：模型发 tool call→add 执行→结果作为 tool-result
  回喂第二次请求→终答落进 append-only 会话日志。 打印面走 session/event
  firehose（user/message、tool/call、tool/result、 assistant/message、turn 边界——s03
  词汇的真身）。测试钉住：组装不炸且服务就位、 defineTool DSL 投影成模型可见 JSON Schema、往返核心断言（第二次请求
  messages 里 有 toolCallId 对得上的 tool-result、日志含完整事件链）、package.json 声明的每个
  依赖钉在核实版本且与实际解析到的安装版本逐个相等。差距如实声明：npm family 处于 0.1.0-rc 预发布段（latest dist-tag
  漂移、0.1.0-rc.5 未单独发布而本地 master 源码停在该 release commit），故依赖全部精确 pin 到 0.1.0-rc.8
  并在测试里锁死。'
